name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Report compile errors as annotations
        if: failure() && steps.build.outcome == 'failure'
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|Execution failed" build.log | head -60 | while IFS= read -r line; do
            safe=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r//g')
            echo "::error::${safe:0:900}"
          done || true

      - name: Publish build log (on failure)
        if: failure() && steps.build.outcome == 'failure'
        run: |
          mkdir -p /tmp/buildlog
          cp build.log /tmp/buildlog/build.log
          grep -E "^e: |^w: .*error|error:|What went wrong|Execution failed" build.log > /tmp/buildlog/errors.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/buildlog/* .
          git add build.log errors.txt
          git commit -m "build log for ${GITHUB_SHA}" > /dev/null
          git push -f origin build-log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAPJI-HardwareLab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release (latest)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CAPJI-HardwareLab.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CAPJI-HardwareLab.apk \
            --title "CAPJI Hardware Lab - latest debug build" \
            --notes "Debug APK built automatically from commit ${GITHUB_SHA}. Download CAPJI-HardwareLab.apk and install it on your Android device." \
            --prerelease \
            --target "${GITHUB_SHA}"
